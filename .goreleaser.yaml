---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: turbo-clicker

env:
  - CI_COMMIT_SHA={{ .FullCommit }}
  - CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/x86_64-linux-gnu-gcc
  - CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc
  - PKG_CONFIG_ALLOW_CROSS=true

before:
  hooks:
    - cargo fetch --locked

builds:
  - builder: rust
    tool: cargo
    command: build
    flags:
      - --release
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    env:
      - >-
        {{- if eq .Target "aarch64-unknown-linux-gnu" }}
          PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
        {{- else if eq .Target "x86_64-unknown-linux-gnu" }}
          PKG_CONFIG_LIBDIR=/usr/lib/x86_64-linux-gnu/pkgconfig
        {{- end }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ tolower .Os }}-{{ .Arch }}"
    files:
      - strip_parent: true
        src: "packages/*"
nfpms:
  - id: linux
    package_name: "{{ .ProjectName }}"
    file_name_template: "{{ .PackageName }}-linux-{{ .Arch }}"
    maintainer: Heathcliff <heathcliff@heathcliff.eu>
    description: |
      GUI based auto-clicker for Linux (Wayland).
      It simulates virtual input via x11/wayland-client.
      The user needs to accept remote access permissions for the app.
    license: Apache-2.0
    homepage: https://github.com/heathcliff26/{{ .ProjectName }}
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - dst: /usr/share/licenses/{{ .PackageName }}
        type: dir
      - dst: /usr/share/doc/{{ .PackageName }}
        type: dir
      - src: LICENSE
        dst: /usr/share/licenses/{{ .PackageName }}/LICENSE
      - src: README.md
        dst: /usr/share/doc/{{ .PackageName }}/README.md
      - src: packages/io.github.heathcliff26.{{ .PackageName }}.desktop
        dst: /usr/share/applications/io.github.heathcliff26.{{ .PackageName }}.desktop
      - src: packages/io.github.heathcliff26.{{ .PackageName }}.svg
        dst: /usr/share/icons/hicolor/scalable/apps/io.github.heathcliff26.{{ .PackageName }}.svg
      - src: io.github.heathcliff26.{{ .PackageName }}.metainfo.xml
        dst: /usr/share/metainfo/io.github.heathcliff26.{{ .PackageName }}.metainfo.xml
    rpm:
      summary: GUI based auto-clicker for Linux

changelog:
  disable: true
release:
  disable: true
